tasks:
  player:
    provider: anthropic
    model: claude-haiku-4-5
    prompt_override:
      system: false
    # Agent-selected actions. Room observation is intentionally handled by
    # the room_survey hook below, so `look` and `check(score|exits)` are not
    # exposed to the model.
    allow:
      - plan_route
      - execute_route
      - move
      - poll
      - flee
      - set_position
      - track
      - examine
      - "check(kind: inventory|equipment|gold|time|weather|levels|wimpy|toggle|where)"
      - consider
      - attack
      - skill_strike
      - say
      - tell
      - channel_say
      - get_item
      - drop_item
      - put_item
      - equip_item
      - consume_item
      - cast_spell
      - use_magic_item
      - shop
      - practice
      - save_character

# Automatic MUD lifecycle work runs in a separate registry and therefore
# needs its own permissions. These calls populate the room/player state given
# to the model without letting the model issue raw look/score traffic.
tools:
  room_survey:
    # The optional ONNX artifact is not bundled in this checkout. Explicitly
    # select the supported no-model fallback so each run does not emit a
    # misleading missing-manifest warning.
    look_candidates:
      extractor: none
    allow:
      - look
      - "check(kind: score|exits)"
      - poll
      - consider
      - examine
mud:
  host: localhost
  port: 4000
  username: dummy
  password: helloworld

  prompt_override:
      system: true
# EVERY tool the agent has comes from this block. boukensha ships none of its
# own — it is an MCP host, and an empty mcp_servers means an agent that can
# only talk. Each entry is one server process: command + args + env, the same
# stdio transport config every MCP host uses.
# The properties below are reserved for future steps are NOT read yet.
# max_iterations: 25 # model round trips per turn before wind-down
# max_turn_tokens: 6000 # cumulative input + output tokens per turn
# max_output_tokens: 1024 # max tokens the model can generate per turn
# compaction_threshold: 0.85 # when to compact the conversation history
mcp_servers:
  # The MUD. `mud` is not special to boukensha any more — it's just the server
  # that happens to know telnet and the login dance. Credentials travel by
  # environment because that is what the stdio transport gives you; the LLM
  # never sees them, and the session lives in the daemon.
  #
  # `command`/`args` are resolved by the OS against the shell's cwd — NOT
  # against boukensha_dir/boukensha_path from ~/.boukensharc, and boukensha
  # never chdirs for you. A relative path here only works when you happen to
  # launch from the repo root. Nothing hunts for the binary on your behalf any
  # more — that discovery logic died with Tools::McpMud, which is the trade
  # for the agent not knowing what a MUD is. `mud-manager` is installed on
  # PATH (the mud_manager gem), so we call it directly instead.
  # This entry is `required` (the default), so a bad path fails loudly at boot.
  mud:
    command: mud-manager
    args:    [--mcp]
    prefix:  tbamud          # the daemon's `look` reaches the agent as tbamud__look
    required: true          # gracefully skip if mud-manager is not installed
    env:
      MUD_HOST:     localhost
      MUD_PORT:     4000
      MUD_NAME:     dummy
      MUD_PASSWORD: helloworld

  # Files. A third-party server nobody wrote boukensha code for — which is the
  # whole point: file access is a server you plug in, not a feature the agent
  # was born with. Edit the last arg to change what it can reach.
  #
  # required: false so a missing npx is a warning, not a dead agent.
  # Disabled for the MUD lesson: `npx -y` may block startup while it downloads
  # the package, and the player agent does not need filesystem access.
  # filesystem:
  #   command:  npx
  #   args:     [-y, "@modelcontextprotocol/server-filesystem", /tmp]
  #   prefix:   fs
  #   required: false
  filesystem:
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "C:/dev/TRY2/claude-code-camp-2026-Q2"
    prefix: fs
    required: false

# Export Boukensha spans to the local OpenTelemetry Collector. The collector
# forwards them to Jaeger (and Tempo when the compare profile is running).
observability:
  otel:
    enabled: true
    capture_content: false
    env:
      OTEL_SERVICE_NAME: boukensha
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
